    <title>

    </title>
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #ef4444; /* red-500 */
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .seo-text {
        color: #666;
        font-size: 14px;
        text-align: center;
        max-width: 600px;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="loader-spinner"></div>
        <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Aplex Cinema</h1>
        <p class="seo-text">
          Loading the latest HD movies, web series, and exclusive content. Aplex Cinema is your premium destination for streaming and downloading high-quality entertainment.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
